services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: simplo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simplo}
      POSTGRES_DB: simplo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - simplo_pg:/var/lib/postgresql/data

volumes:
  simplo_pg:
    external: true
    name: simplo_simplo_pg
